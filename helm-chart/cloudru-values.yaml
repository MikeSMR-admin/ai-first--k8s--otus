# ============================================================
#  Базовые настройки - версия v0.8.0
# ============================================================
images:
  repository: gcr.io/google-samples
  tag: "v0.8.0"

# ============================================================
#  Безопасность (упрощаем)
# ============================================================
serviceAccounts:
  create: false

networkPolicies:
  create: false

sidecars:
  create: false

authorizationPolicies:
  create: false

securityContext:
  enable: true

seccompProfile:
  enable: false

# ============================================================
#  Observability (отключаем)
# ============================================================
opentelemetryCollector:
  create: false
  projectId: "PROJECT_ID"

googleCloudOperations:
  profiler: false
  tracing: false
  metrics: false

# ============================================================
#  База данных для Cart Service (Redis внутри кластера)
# ============================================================
cartDatabase:
  type: redis
  connectionString: "redis-cart:6379"
  inClusterRedis:
    create: true
    name: redis-cart
    publicRepository: true
  externalRedisTlsOrigination:
    enable: false

# ============================================================
#  Доступ к Frontend
# ============================================================
frontend:
  create: true
  name: frontend
  externalService: true
  cymbalBranding: false
  platform: local
  singleSharedSession: false
  virtualService:
    create: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================
#  Генератор нагрузки (отключаем для экономии)
# ============================================================
loadGenerator:
  create: false

# ============================================================
#  Ресурсы для микросервисов (скромные)
# ============================================================
adService:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi


    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 80m
      memory: 128Mi

currencyService:
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 80m
      memory: 128Mi

emailService:
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 80m
      memory: 128Mi

paymentService:
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 80m
      memory: 128Mi

productCatalogService:
  resources:
    requests:

schema: spec-driven
context: |
  schema: spec-driven
  context: |
    Язык генерации: Русский.
    Все артефакты (предложения, спецификации, дизайн-документы, задачи и т.д.) должны быть написаны на русском языке.
    
    Технические термины и аббревиатуры (API, REST, GraphQL, JSON, YAML, Kubernetes, Docker, Git, HTTP, gRPC, OpenAPI, Swagger, CI/CD) оставляй на английском.
    Названия полей, параметров, переменных, команд, путей к файлам и примеров кода — на английском (как в исходниках).
    Все пояснения, описания бизнес-логики, архитектурные решения и инструкции — на русском.
    
    Стиль: профессиональный, технический, точный, без воды.
    Все артефакты должны быть написаны на русском языке, но:
    - Сохраняй технические термины, такие как "API", "REST", "GraphQL", на английском.
    - Примеры кода и пути к файлам оставляй на английском.
    
    # Здесь может быть другой контекст вашего проекта
    Стек технологий: TypeScript, React, Node.js

  # При исследовании, исполнении и других операциях с OpenSpec
  # использовать в первую очередь инструкции из каталога docs/cloud-ru
  # Этот каталог содержит официальную документацию cloud.ru по Managed Kubernetes и API
  #
  # Основные документы для справки:
  # - Быстрый старт k8s.md (создание и подключение к кластеру)
  # - Аутентификация в API Managed Kubernetes.md (получение токенов и ключей)
  # - Создать кластер k8s.md (API-запросы для создания кластеров)
  # - Создать группу узлов k8s.md (API-запросы для создания групп узлов)
  # - Подключиться к кластеру k8s.md (настройка kubeconfig и cloudlogin)
  # - Управление доступом в Managed Kubernetes.md (RBAC и сервисные аккаунты)
  # - Создать сервисный аккаунт в cloud.ru.md (создание и настройка SA)
  # - Просмотреть сервисный аккаунт в cloud.ru.md (проверка SA через API)
  # - Ограничения и особенности сервиса Managed Kubernetes.md (квоты и лимиты)
  # - Версии k8s.md (поддерживаемые версии Kubernetes)
  #
  # Основные API эндпоинты:
  # - IAM API: https://iam.api.cloud.ru/api/v1/
  # - Managed Kubernetes API: https://mk8s.api.cloud.ru/v3/
  #
  # Всегда проверять актуальную документацию в docs/cloud-ru перед выполнением операций
  # Нельзя сохранять и хранить в репозитории секреты. 

description = "Начать новое изменение, используя экспериментальный рабочий процесс артефактов (OPSX)"

prompt = """
Начать новое изменение, используя экспериментальный подход, ориентированный на артефакты.

**Ввод**: Аргумент после `/opsx:new` - это имя изменения (kebab-case) ИЛИ описание того, что пользователь хочет построить.

**Шаги**

1. **Если ввод не предоставлен, спросите, что они хотят построить**

   Используйте **AskUserQuestion tool** (открытый, без предустановленных вариантов) чтобы спросить:
   > "What change do you want to work on? Describe what you want to build or fix."

   Из их описания выведите имя в формате kebab-case (например, "add user authentication" → `add-user-auth`).

   **ВАЖНО**: Не продолжайте без понимания того, что пользователь хочет построить.

2. **Определение схемы рабочего процесса**

   Используйте схему по умолчанию (пропустите `--schema`), если пользователь явно не запросит другой рабочий процесс.

   **Используйте другую схему только если пользователь упоминает:**
   - Конкретное имя схемы → используйте `--schema <name>`
   - "show workflows" или "what workflows" → запустите `openspec schemas --json` и позвольте им выбрать

   **В противном случае**: Пропустите `--schema` для использования по умолчанию.

3. **Создание каталога изменения**
   ```bash
   openspec new change "<name>"
   ```
   Добавьте `--schema <name>` только если пользователь запросил конкретный рабочий процесс.
   Это создает каркасное изменение в planning home, разрешенном CLI.

4. **Показ статуса артефактов**
   ```bash
   openspec status --change "<name>" --json
   ```
   Используйте возвращенные `planningHome`, `changeRoot`, `artifactPaths`, и `nextSteps` вместо предположения путей, локальных для репозитория.

5. **Получение инструкций для первого артефакта**
   Первый артефакт зависит от схемы. Проверьте вывод статуса, чтобы найти первый артефакт со статусом "ready".
   ```bash
   openspec instructions <first-artifact-id> --change "<name>"
   ```
   Это выводит шаблон и контекст для создания первого артефакта.

6. **ОСТАНОВИТЕСЬ и ждите указаний пользователя**

**Вывод**

После завершения шагов, суммируйте:
- Имя и местоположение изменения
- Используемая схема/рабочий процесс и его последовательность артефактов
- Текущий статус (0/N артефактов завершено)
- Шаблон для первого артефакта
- Запрос: "Ready to create the first artifact? Run `/opsx:continue` or just describe what this change is about and I'll draft it."

**Охранные меры**
- НЕ создавайте пока никаких артефактов - просто показывайте инструкции
- НЕ продвигайтесь дальше показа шаблона первого артефакта
- Если имя недействительно (не kebab-case), запросите допустимое имя
- Если изменение с таким именем уже существует, предложите использовать `/opsx:continue` вместо этого
- Передайте --schema при использовании нестандартной схемы
"""
description = "Архивировать завершенное изменение в экспериментальном рабочем процессе"

prompt = """
Архивировать завершенное изменение в экспериментальном рабочем процессе.

**Ввод**: Опционально укажите имя изменения после `/opsx:archive` (например, `/opsx:archive add-auth`). Если не указано, проверьте, можно ли вывести его из контекста разговора. Если неясно или неоднозначно, ВЫ ДОЛЖНЫ запросить доступные изменения.

**Шаги**

1. **Если имя изменения не указано, запросить выбор**

   Запустите `openspec list --json` для получения доступных изменений. Используйте **AskUserQuestion tool** для выбора пользователем.

   Покажите только активные изменения (еще не архивированные).
   Включите используемую схему для каждого изменения, если доступно.

   **ВАЖНО**: Не угадывайте и не выбирайте автоматически изменение. Всегда позволяйте пользователю выбрать.

2. **Проверка статуса завершения артефактов**

   Запустите `openspec status --change "<name>" --json` для проверки завершения артефактов.

   Разберите JSON для понимания:
   - `schemaName`: Используемый рабочий процесс
   - `planningHome`, `changeRoot`, `artifactPaths`, и `actionContext`: контекст путей и области
   - `artifacts`: Список артефактов с их статусом (`done` или другой)

   Если статус сообщает `actionContext.mode: "workspace-planning"`, объясните, что архивация рабочей области не поддерживается в этом срезе и ОСТАНОВИТЕСЬ. Не перемещайте изменения рабочей области в локальные архивы репозитория или не редактируйте связанные репозитории.

   **Если любой артефакт не `done`:**
   - Показать предупреждение со списком незавершенных артефактов
   - Запросить подтверждение пользователя на продолжение
   - Продолжить если пользователь подтвердит

3. **Проверка статуса завершения задач**

   Прочитайте файл задач (обычно `tasks.md`) для проверки незавершенных задач.

   Подсчитайте задачи, помеченные как `- [ ]` (незавершенные) и `- [x]` (завершенные).

   **Если найдены незавершенные задачи:**
   - Показать предупреждение с количеством незавершенных задач
   - Запросить подтверждение пользователя на продолжение
   - Продолжить если пользователь подтвердит

   **Если файл задач не существует:** Продолжить без предупреждения о задачах.

4. **Оценка состояния синхронизации delta specs**

   Используйте `artifactPaths.specs.existingOutputPaths` из JSON статуса для проверки delta specs. Если их нет, продолжить без запроса синхронизации.

   **Если delta specs существуют:**
   - Сравните каждый delta spec с соответствующим основным spec по пути `openspec/specs/<capability>/spec.md`
   - Определите, какие изменения будут применены (добавления, модификации, удаления, переименования)
   - Показать объединенную сводку перед запросом

   **Варианты запроса:**
   - Если нужны изменения: "Sync now (recommended)", "Archive without syncing"
   - Если уже синхронизировано: "Archive now", "Sync anyway", "Cancel"

   Если пользователь выбирает синхронизацию, используйте Task tool (subagent_type: "general-purpose", prompt: "Use Skill tool to invoke openspec-sync-specs for change '<name>'. Delta spec analysis: <include the analyzed delta spec summary>"). Продолжить архивацию независимо от выбора.

5. **Выполнение архивации**

   Создайте каталог `archive` под `planningHome.changesDir`, если он не существует:
   ```bash
   mkdir -p "<planningHome.changesDir>/archive"
   ```

   Сгенерируйте целевое имя, используя текущую дату: `YYYY-MM-DD-<change-name>`

   **Проверьте, существует ли цель:**
   - Если да: Ошибка, предложите переименовать сущ��ствующую архивацию или использовать другую дату
   - Если нет: Переместите `changeRoot` в каталог архива

   ```bash
   mv "<changeRoot>" "<planningHome.changesDir>/archive/YYYY-MM-DD-<name>"
   ```

6. **Показ сводки**

   Показать сводку завершения архивации, включая:
   - Имя изменения
   - Используемую схему
   - Путь архива
   - Статус синхронизации spec (synced / sync skipped / no delta specs)
   - Заметку о любых предупреждениях (незавершенные артефакты/задачи)

**Вывод при успехе**

```
## Archive Complete

**Change:** <change-name>
**Schema:** <schema-name>
**Archived to:** the archive path derived from `planningHome.changesDir`/YYYY-MM-DD-<name>/
**Specs:** ✓ Synced to main specs

All artifacts complete. All tasks complete.
```

**Вывод при успехе (Нет delta specs)**

```
## Archive Complete

**Change:** <change-name>
**Schema:** <schema-name>
**Archived to:** the archive path derived from `planningHome.changesDir`/YYYY-MM-DD-<name>/
**Specs:** No delta specs

All artifacts complete. All tasks complete.
```

**Вывод при успехе с предупреждениями**

```
## Archive Complete (with warnings)

**Change:** <change-name>
**Schema:** <schema-name>
**Archived to:** the archive path derived from `planningHome.changesDir`/YYYY-MM-DD-<name>/
**Specs:** Sync skipped (user chose to skip)

**Warnings:**
- Archived with 2 incomplete artifacts
- Archived with 3 incomplete tasks
- Delta spec sync was skipped (user chose to skip)

Review the archive if this was not intentional.
```

**Вывод при ошибке (Архив уже существует)**

```
## Archive Failed

**Change:** <change-name>
**Target:** the archive path derived from `planningHome.changesDir`/YYYY-MM-DD-<name>/

Target archive directory already exists.

**Options:**
1. Rename the existing archive
2. Delete the existing archive if it's a duplicate
3. Wait until a different date to archive
```

**Охранные меры**
- Всегда запрашивайте выбор изменения, если не предоставлено
- Используйте artifact graph (openspec status --json) для проверки завершения
- Не блокируйте архивацию на предупреждениях - просто информируйте и подтверждайте
- Сохраняйте .openspec.yaml при перемещении в архив (он перемещается с каталогом)
- Показывайте ясную сводку того, что произошло
- Если запрошена синхронизация, используйте Skill tool для вызова `openspec-sync-specs` (agent-driven)
- Если delta specs существуют, всегда запускайте оценку синхронизации и показывайте объединенную сводку перед запросом
"""
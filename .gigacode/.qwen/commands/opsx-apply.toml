description = "Реализовать задачи из изменений OpenSpec (Экспериментально)"

prompt = """
Реализовать задачи из изменений OpenSpec.

**Ввод**: Опционально укажите имя изменения (например, `/opsx:apply add-auth`). Если не указано, проверьте, можно ли вывести его из контекста разговора. Если неясно или неоднозначно, ВЫ ДОЛЖНЫ запросить доступные изменения.

**Шаги**

1. **Выбор изменения**

   Если имя предоставлено, используйте его. В противном случае:
   - Выведите из контекста разговора, если пользователь упомянул изменение
   - Автоматически выберите, если существует только одно активное изменение
   - Если неоднозначно, запустите `openspec list --json` для получения доступных изменений и используйте **AskUserQuestion tool** для выбора пользователем

   Всегда объявляйте: "Using change: <name>" и как переопределить (например, `/opsx:apply <other>`).

2. **Проверка статуса для понимания схемы**
   ```bash
   openspec status --change "<name>" --json
   ```
   Разберите JSON для понимания:
   - `schemaName`: Используемый рабочий процесс (например, "spec-driven")
   - `planningHome`, `changeRoot`, и `actionContext`: контекст планирования и ограничения редактирования
   - Какой артефакт содержит задачи (обычно "tasks" для spec-driven, проверьте статус для других)

3. **Получение инструкций по применению**

   ```bash
   openspec instructions apply --change "<name>" --json
   ```

   Это возвращает:
   - `contextFiles`: artifact ID -> массив конкретных путей к файлам (варьируется по схеме)
   - Прогресс (всего, выполнено, осталось)
   - Список задач со статусом
   - Динамическая инструкция на основе текущего состояния

   **Обработка состояний:**
   - Если `state: "blocked"` (отсутствуют артефакты): показать сообщение, предложить использовать `/opsx:continue`
   - Если `state: "all_done"`: поздравить, предложить архивацию
   - Иначе: приступить к реализации

   **Охрана рабочей области:** Если статус JSON сообщает `actionContext.mode: "workspace-planning"` и `allowedEditRoots` пуст, объясните, что полное применение рабочей области не поддерживается в этом срезе. Обращайте связанные репозитории и папки как контекст только для чтения, запросите пользователя выбрать затронутую область через явный рабочий процесс реализации и ОСТАНОВИТЕСЬ перед редактированием файлов.

4. **Чтение файлов контекста**

   Прочитайте каждый путь к файлу, перечисленный в `contextFiles` из вывода инструкций по применению.
   Файлы зависят от используемой схемы:
   - **spec-driven**: proposal, specs, design, tasks
   - Другие схемы: следуйте contextFiles из вывода CLI

5. **Показ текущего прогресса**

   Отобразите:
   - Используемую схему
   - Прогресс: "N/M tasks complete"
   - Обзор оставшихся задач
   - Динамическую инструкцию из CLI

6. **Реализация задач (циклически до завершения или блокировки)**

   Для каждой отложенной задачи:
   - Покажите, над какой задачей работаете
   - Выполните требуемые изменения кода
   - Держите изменения минимальными и сфокусированными
   - Пометьте задачу как выполненную в файле задач: `- [ ]` → `- [x]`
   - Продолжите к следующей задаче

   **Пауза если:**
   - Задача неясна → запросить уточнение
   - Реализация выявляет проблему дизайна → предложить обновить артефакты
   - Ошибка или блокировка возникла → сообщить и ждать руководства
   - Пользователь прерывает

7. **При завершении или паузе, показать статус**

   Отобразите:
   - Задачи выполненные в этой сессии
   - Общий прогресс: "N/M tasks complete"
   - Если все сделано: предложить архивацию
   - Если на паузе: объяснить почему и ждать руководства

**Вывод во время реализации**

```
## Implementing: <change-name> (schema: <schema-name>)

Working on task 3/7: <task description>
[...implementation happening...]
✓ Task complete

Working on task 4/7: <task description>
[...implementation happening...]
✓ Task complete
```

**Вывод при завершении**

```
## Implementation Complete

**Change:** <change-name>
**Schema:** <schema-name>
**Progress:** 7/7 tasks complete ✓

### Completed This Session
- [x] Task 1
- [x] Task 2
...

All tasks complete! You can archive this change with `/opsx:archive`.
```

**Вывод при паузе (Встречена проблема)**

```
## Implementation Paused

**Change:** <change-name>
**Schema:** <schema-name>
**Progress:** 4/7 tasks complete

### Issue Encountered
<description of the issue>

**Options:**
1. <option 1>
2. <option 2>
3. Other approach

What would you like to do?
```

**Охранные меры**
- Продолжайте проходить задачи до завершения или блокировки
- Всегда читайте файлы контекста перед началом (из вывода инструкций по применению)
- Если задача неясна, остановитесь и запросите перед реализацией
- Если реализация выявляет проблемы, остановитесь и предложите обновления артефактов
- Держите изменения кода минимальными и сфокусированными на каждой задаче
- Обновляйте флажок задачи сразу после завершения каждой задачи
- Остановитесь на ошибках, блокировках или неясных требованиях - не угадывайте
- Используйте contextFiles из вывода CLI, не предполагайте конкретные имена файлов

**Интеграция гибкого рабочего процесса**

Этот навык поддерживает модель "actions on a change":

- **Can be invoked anytime**: Before all artifacts are done (if tasks exist), after partial implementation, interleaved with other actions
- **Allows artifact updates**: If implementation reveals design issues, suggest updating artifacts - not phase-locked, work fluidly
"""

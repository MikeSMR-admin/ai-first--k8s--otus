description = "Синхронизировать delta specs из изменения в основные specs"

prompt = """
Синхронизировать delta specs из изменения в основные specs.

Это операция, **управляемая агентом** - вы будете читать delta specs и напрямую редактировать основные specs для применения изменений. Это позволяет интеллектуальное слияние (например, добавление сценария без копирования всего требования).

**Ввод**: Опционально укажите имя изменения после `/opsx:sync` (например, `/opsx:sync add-auth`). Если не указано, проверьте, можно ли вывести его из контекста разговора. Если неясно или неоднозначно, ВЫ ДОЛЖНЫ запросить доступные изменения.

**Шаги**

1. **Если имя изменения не указано, запросить выбор**

   Запустите `openspec list --json` для получения доступных изменений. Используйте **AskUserQuestion tool** для выбора пользователем.

   Покажите изменения, которые имеют delta specs (в каталоге `specs/`).

   **ВАЖНО**: Не угадывайте и не выбирайте автоматически изменение. Всегда позволяйте пользователю выбрать.

2. **Разрешение контекста изменения**

   Запустите:
   ```bash
   openspec status --change "<name>" --json
   ```

   Если статус сообщает `actionContext.mode: "workspace-planning"`, объясните, что синхронизация spec рабочей области не поддерживается в этом срезе и ОСТАНОВИТЕСЬ. Не возвращайтесь к путям, локальным для репозитория, или не редактируйте связанные репозитории.

3. **Поиск delta specs**

   Используйте `artifactPaths.specs.existingOutputPaths` из JSON статуса как список файлов delta spec.

   Каждый файл delta spec содержит разделы, такие как:
   - `## ADDED Requirements` - Новые требования для добавления
   - `## MODIFIED Requirements` - Изменения к существующим требованиям
   - `## REMOVED Requirements` - Требования для удаления
   - `## RENAMED Requirements` - Требования для переименования (формат FROM:/TO:)

   Если delta specs не найдены, сообщите пользователю и остановитесь.

4. **Для каждого delta spec применить изменения к основным specs**

   Для каждого пути delta spec capability, локального для репозитория, возвращаемого CLI:

   a. **Прочитайте delta spec** для понимания намеренных изменений

   b. **Прочитайте основной spec** по пути `openspec/specs/<capability>/spec.md` (может еще не существовать)

   c. **Примените изменения интеллектуально**:

      **ADDED Requirements:**
      - Если требование не существует в основном spec → добавьте его
      - Если требование уже существует → обновите его для соответствия (рассматривайте как неявное MODIFIED)

      **MODIFIED Requirements:**
      - Найдите требование в основном spec
      - Примените изменения - это может быть:
        - Добавление новых сценариев (не нужно копировать существующие)
        - Модификация существующих сценариев
        - Изменение описания требования
      - Сохраните сценарии/контент, не упомянутые в delta

      **REMOVED Requirements:**
      - Удалите весь блок требования из основного spec

      **RENAMED Requirements:**
      - Найдите FROM требование, переименуйте в TO

   d. **Создайте новый основной spec**, если capability еще не существует:
      - Создайте `openspec/specs/<capability>/spec.md`
      - Добавьте раздел Purpose (может быть кратким, пометьте как TBD)
      - Добавьте раздел Requirements с ADDED требованиями

5. **Показать сводку**

   После применения всех изменений, суммируйте:
   - Какие capabilities были обновлены
   - Какие изменения были сделаны (требования добавлены/модифицированы/удалены/переименованы)

**Delta Spec Format Reference**

```markdown
## ADDED Requirements

### Requirement: New Feature
The system SHALL do something new.

#### Scenario: Basic case
- **WHEN** user does X
- **THEN** system does Y

## MODIFIED Requirements

### Requirement: Existing Feature
#### Scenario: New scenario to add
- **WHEN** user does A
- **THEN** system does B

## REMOVED Requirements

### Requirement: Deprecated Feature

## RENAMED Requirements

- FROM: `### Requirement: Old Name`
- TO: `### Requirement: New Name`
```

**Key Principle: Intelligent Merging**

Unlike programmatic merging, you can apply **partial updates**:
- To add a scenario, just include that scenario under MODIFIED - don't copy existing scenarios
- The delta represents *intent*, not a wholesale replacement
- Use your judgment to merge changes sensibly

**Output On Success**

```
## Specs Synced: <change-name>

Updated main specs:

**<capability-1>**:
- Added requirement: "New Feature"
- Modified requirement: "Existing Feature" (added 1 scenario)

**<capability-2>**:
- Created new spec file
- Added requirement: "Another Feature"

Main specs are now updated. The change remains active - archive when implementation is complete.
```

**Guardrails**
- Read both delta and main specs before making changes
- Preserve existing content not mentioned in delta
- If something is unclear, ask for clarification
- Show what you're changing as you go
- The operation should be idempotent - running twice should give same result
"""
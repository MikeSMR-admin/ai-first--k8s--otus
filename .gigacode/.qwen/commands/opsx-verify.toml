description = "Проверить, что реализация соответствует артефактам изменения перед архивацией"

prompt = """
Проверить, что реализация соответствует артефактам изменения (specs, tasks, design).

**Ввод**: Опционально укажите имя изменения после `/opsx:verify` (например, `/opsx:verify add-auth`). Если не указано, проверьте, можно ли вывести его из контекста разговора. Если неясно или неоднозначно, ВЫ ДОЛЖНЫ запросить доступные изменения.

**Шаги**

1. **Если имя изменения не указано, запросить выбор**

   Запустите `openspec list --json` для получения доступных изменений. Используйте **AskUserQuestion tool** для выбора пользователем.

   Покажите изменения, которые имеют задачи реализации (артефакт tasks существует).
   Включите используемую схему для каждого изменения, если доступно.
   Пометьте изменения с незавершенными задачами как "(In Progress)".

   **ВАЖНО**: Не угадывайте и не выбирайте автоматически изменение. Всегда позволяйте пользователю выбрать.

2. **Проверка статуса для понимания схемы**
   ```bash
   openspec status --change "<name>" --json
   ```
   Разберите JSON для понимания:
   - `schemaName`: Используемый рабочий процесс (например, "spec-driven")
   - `planningHome`, `changeRoot`, `artifactPaths`, и `actionContext`: контекст путей и области
   - Какие артефакты существуют для этого изменения

   Если статус сообщает `actionContext.mode: "workspace-planning"`, объясните, что полная проверка реализации рабочей области не поддерживается в этом срезе и ОСТАНОВИТЕСЬ. Не выводите принадлежность реализации локальной для репозитория или не редактируйте связанные репозитории.

3. **Получение контекста планирования и загрузка артефактов**

   ```bash
   openspec instructions apply --change "<name>" --json
   ```

   Это возвращает каталог изменения и `contextFiles` (artifact ID -> массив конкретных путей к файлам). Прочитайте все доступные артефакты из `contextFiles`.

4. **Инициализация структуры отчета проверки**

   Создайте структуру отчета с тремя измерениями:
   - **Completeness**: Отслеживание задач и покрытия spec
   - **Correctness**: Отслеживание реализации требования и покрытия сценария
   - **Coherence**: Отслеживание соответствия дизайну и согласованности шаблонов

   Каждое измерение может иметь проблемы CRITICAL, WARNING или SUGGESTION.

5. **Проверка Completeness**

   **Task Completion**:
   - Если `contextFiles.tasks` существует, прочитайте каждый путь к файлу в нем
   - Разберите флажки: `- [ ]` (незавершенные) против `- [x]` (завершенные)
   - Подсчитайте завершенные и общее количество задач
   - Если существуют незавершенные задачи:
     - Добавьте CRITICAL проблему для каждой незавершенной задачи
     - Рекомендация: "Complete task: <description>" или "Mark as done if already implemented"

   **Spec Coverage**:
   - Если delta specs существуют в `contextFiles.specs`:
     - Извлеките все требования (помеченные с "### Requirement:")
     - Для каждого требования:
       - Поиск в кодовой базе по ключевым словам, связанным с требованием
       - Оцените, вероятно ли реализация существует
     - Если требования кажутся нереализованными:
       - Добавьте CRITICAL проблему: "Requirement not found: <requirement name>"
       - Рекомендация: "Implement requirement X: <description>"

6. **Проверка Correctness**

   **Requirement Implementation Mapping**:
   - Для каждого требования из delta specs:
     - Поиск в кодовой базе доказательств реализации
     - Если найдено, отметьте пути файлов и диапазоны строк
     - Оцените, соответствует ли реализация намерению требования
     - Если обнаружено расхождение:
       - Добавьте WARNING: "Implementation may diverge from spec: <details>"
       - Рекомендация: "Review <file>:<lines> against requirement X"

   **Scenario Coverage**:
   - Для каждого сценария в delta specs (помеченного с "#### Scenario:"):
     - Проверьте, обрабатываются ли условия в коде
     - Проверьте, существуют ли тесты, покрывающие сценарий
     - Если сценарий кажется непокрытым:
       - Добавьте WARNING: "Scenario not covered: <scenario name>"
       - Рекомендация: "Add test or implementation for scenario: <description>"

7. **Проверка Coherence**

   **Design Adherence**:
   - Если `contextFiles.design` существует:
     - Извлеките ключевые решения (ищите разделы, такие как "Decision:", "Approach:", "Architecture:")
     - Проверьте, следует ли реализация этим решениям
     - Если обнаружено противоречие:
       - Добавьте WARNING: "Design decision not followed: <decision>"
       - Рекомендация: "Update implementation or revise design.md to match reality"
   - Если нет design.md: Пропустите проверку соответствия дизайну, отметьте "No design.md to verify against"

   **Code Pattern Consistency**:
   - Просмотрите новый код на согласованность с шаблонами проекта
   - Проверьте именование файлов, структуру каталогов, стиль кодирования
   - Если найдены значительные отклонения:
     - Добавьте SUGGESTION: "Code pattern deviation: <details>"
     - Рекомендация: "Consider following project pattern: <example>"

8. **Генерация отчета проверки**

   **Summary Scorecard**:
   ```
   ## Verification Report: <change-name>

   ### Summary
   | Dimension    | Status           |
   |--------------|------------------|
   | Completeness | X/Y tasks, N reqs|
   | Correctness  | M/N reqs covered |
   | Coherence    | Followed/Issues  |
   ```

   **Проблемы по приоритету**:

   1. **CRITICAL** (Must fix before archive):
      - Незавершенные задачи
      - Отсутствующие реализации требований
      - Каждая с конкретной, выполнимой рекомендацией

   2. **WARNING** (Should fix):
      - Расхождения spec/design
      - Отсутствующее покрытие сценариев
      - Каждая с конкретной рекомендацией

   3. **SUGGESTION** (Nice to fix):
      - Несогласованности шаблонов
      - Незначительные улучшения
      - Каждая с конкретной рекомендацией

   **Final Assessment**:
   - Если CRITICAL проблемы: "X critical issue(s) found. Fix before archiving."
   - Если только warnings: "No critical issues. Y warning(s) to consider. Ready for archive (with noted improvements)."
   - Если все ясно: "All checks passed. Ready for archive."

**Verification Heuristics**

- **Completeness**: Сфокусируйтесь на объективных пунктах контрольного списка (флажки, список требований)
- **Correctness**: Используйте поиск по ключевым словам, анализ путей файлов, разумное предположение - не требуйте идеальной уверенности
- **Coherence**: Ищите явные несоответствия, не придирайтесь к стилю
- **False Positives**: Когда не уверены, предпочитайте SUGGESTION над WARNING, WARNING над CRITICAL
- **Actionability**: Каждая проблема должна иметь конкретную рекомендацию с ссылками на файл/строки, где применимо

**Graceful Degradation**

- Если существует только tasks.md: проверьте только завершение задач, пропустите проверки spec/design
- Если существуют tasks + specs: проверьте completeness и correctness, пропустите design
- Если полные артефакты: проверьте все три измерения
- Всегда отмечайте, какие проверки были пропущены и почему

**Output Format**

Use clear markdown with:
- Table for summary scorecard
- Grouped lists for issues (CRITICAL/WARNING/SUGGESTION)
- Code references in format: `file.ts:123`
- Specific, actionable recommendations
- No vague suggestions like "consider reviewing"
"""
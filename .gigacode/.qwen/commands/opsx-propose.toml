description = "Предложить новое изменение - создать его и сгенерировать все артефакты за один шаг"

prompt = """
Предложить новое изменение - создать изменение и сгенерировать все артефакты за один шаг.

Я создам изменение с артефактами:
- proposal.md (what & why)
- design.md (how)
- tasks.md (implementation steps)

When ready to implement, run /opsx:apply

---

**Ввод**: Аргумент после `/opsx:propose` - это имя изменения (kebab-case) ИЛИ описание того, что пользователь хочет построить.

**Шаги**

1. **Если ввод не предоставлен, спросите, что они хотят построить**

   Используйте **AskUserQuestion tool** (открытый, без предустановленных вариантов) чтобы спросить:
   > "What change do you want to work on? Describe what you want to build or fix."

   Из их описания выведите имя в формате kebab-case (например, "add user authentication" → `add-user-auth`).

   **ВАЖНО**: Не продолжайте без понимания того, что пользователь хочет построить.

2. **Создание каталога изменения**
   ```bash
   openspec new change "<name>"
   ```
   Это создает каркасное изменение в planning home, разрешенном CLI с `.openspec.yaml`.

3. **Получение порядка сборки артефактов**
   ```bash
   openspec status --change "<name>" --json
   ```
   Разберите JSON для получения:
   - `applyRequires`: массив ID артефактов, необходимых перед реализацией (например, `["tasks"]`)
   - `artifacts`: список всех артефактов с их статусом и зависимостями
   - `planningHome`, `changeRoot`, `artifactPaths`, и `actionContext`: контекст путей и области. Используйте их вместо предположения путей, локальных для репозитория.

4. **Создание артефактов по порядку до готовности к применению**

   Используйте **TodoWrite tool** для отслеживания прогресса через артефакты.

   Циклически проходите по артефактам в порядке зависимостей (артефакты без отложенных зависимостей первыми):

   a. **Для каждого артефакта, который `ready` (зависимости удовлетворены)**:
      - Получить инструкции:
        ```bash
        openspec instructions <artifact-id> --change "<name>" --json
        ```
      - JSON инструкций включает:
        - `context`: Фон проекта (ограничения для вас - НЕ включайте в вывод)
        - `rules`: Правила, специфичные для артефакта (ограничения для вас - НЕ включайте в вывод)
        - `template`: Структура для использования в вашем выходном файле
        - `instruction`: Рекомендации, специфичные для схемы, для этого типа артефакта
        - `resolvedOutputPath`: Разрешенный путь или шаблон для записи артефакта
        - `dependencies`: Завершенные артефакты для чтения для контекста
      - Прочитайте любые завершенные файлы зависимостей для контекста
      - Создайте файл артефакта, используя `template` как структуру и запишите его в `resolvedOutputPath`
      - Примените `context` и `rules` как ограничения - но НЕ копируйте их в файл
      - Покажите краткий прогресс: "Created <artifact-id>"

   b. **Продолжайте, пока все артефакты `applyRequires` не будут завершены**
      - После создания каждого артефакта, повторно запустите `openspec status --change "<name>" --json`
      - Проверьте, имеет ли каждый ID артефакта в `applyRequires` статус `done` в массиве артефактов
      - Остановитесь, когда все артефакты `applyRequires` будут завершены

   c. **Если артефакт требует ввода пользователя** (неясный контекст):
      - Используйте **AskUserQuestion tool** для уточнения
      - Затем продолжите с созданием

5. **Показать финальный статус**
   ```bash
   openspec status --change "<name>"
   ```

**Вывод**

После завершения всех артефактов, суммируйте:
- Имя и местоположение изменения
- Список созданных артефактов с краткими описаниями
- Что готово: "All artifacts created! Ready for implementation."
- Запрос: "Run `/opsx:apply` to start implementing."

**Руководство по созданию артефактов**

- Следуйте полю `instruction` из `openspec instructions` для каждого типа артефакта
- Схема определяет, что должен содержать каждый артефакт - следуйте ей
- Прочитайте артефакты зависимостей для контекста перед созданием новых
- Используйте `template` как структуру для вашего выходного файла - заполните его разделы
- **ВАЖНО**: `context` и `rules` - это ограничения для ВАС, а не контент для файла
  - НЕ копируйте блоки `<context>`, `<rules>`, `<project_context>` в артефакт
  - Эти элементы направляют то, что вы пишете, но никогда не должны появляться в выводе

**Охранные меры**
- Создайте ВСЕ артефакты, необходимые для реализации (как определено `apply.requires` схемы)
- Всегда читайте артефакты зависимостей перед созданием нового
- Если контекст критически неясен, спросите пользователя - но предпочитайте принимать разумные решения, чтобы сохранить темп
- Если изменение с таким именем уже существует, спросите, хочет ли пользователь продолжить его или создать новое
- Проверьте, что каждый файл артефакта существует после записи, прежде чем переходить к следующему
"""